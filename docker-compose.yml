services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calsync}
      POSTGRES_USER: ${POSTGRES_USER:-calsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calsync}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calsync} -d ${POSTGRES_DB:-calsync}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3080}:${APP_PORT:-3080}"
    volumes:
      - ./.runtime:/app/.runtime
    command: >-
      python -m uvicorn calsync.main:app --host ${APP_HOST:-0.0.0.0} --port ${APP_PORT:-3080}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-3080}/healthz')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
